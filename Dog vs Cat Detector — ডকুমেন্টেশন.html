C.forEach((c,k)=>{h+=`<div class="card step" id="c${k+1}" style="border-left-color:var(--${{s1:"ac",s2:"o",s3:"p",s4:"g"}[c[2]]})"><h3>Cell ${k+1} — ${T(c[0],c[1])}</h3><div class="io"><div class="i"><h4>${T("ইনপুট","Input")}</h4>${T(c[3][0],c[3][1])}</div><div class="o"><h4>${T("আউটপুট","Output")}</h4>${T(c[5][0],c[5][1])}</div></div><div class="pr"><b>${T("প্রসেস","Process")}:</b> ${T(c[4][0],c[4][1])}</div></div>`});
h+=`<div class="card"><b>${T("লেবেল ফাইলের নমুনা (YOLO ফরম্যাট)","Sample label file (YOLO format)")}</b><p style="margin:8px 0"><code>0 0.512000 0.480000 0.620000 0.710000</code></p><p style="margin:0;color:var(--mu);font-size:14px">${T("class (0=cat, 1=dog), x-কেন্দ্র, y-কেন্দ্র, প্রস্থ, উচ্চতা (সব ০–১ স্কেলে)। প্রতি ছবিতে একটি বক্স।","class (0=cat, 1=dog), x-center, y-center, width, height (all 0–1). One box per image.")}</p></div></section>`;
h+=`<section id="split">${H(0,5,"ডেটা ভাগ","Data split")}
<p>${T("Cell 5 শেষে <code>/content/dog_cat</code> এর ভিতরে ডেটা এভাবে ভাগ হয়:","After Cell 5, the data inside <code>/content/dog_cat</code> is divided like this:")}</p>
<div class="card"><b>train/images</b><div class="bar" style="margin:8px 0 14px"><div style="width:85%;background:var(--ac)">train 85% ${T("(ট্রেনিং)","(training)")}</div><div style="width:15%;background:var(--o)">valid 15%</div></div>
<b>test/images</b><div class="bar" style="margin-top:8px"><div style="width:100%;background:var(--g)">test 100% ${T("(Cell 8 এ ডিটেকশন দেখতে)","(shown in Cell 8)")}</div></div></div>
<p style="color:var(--mu);font-size:14px">${T("valid ট্রেনিংয়ের সময় যাচাইয়ে ব্যবহৃত হয়; test ছবি ট্রেনিং বা যাচাইয়ে যায় না।","valid is used for validation during training; test images are used for neither training nor validation.")}</p></section>`;
h+=`<section id="outputs">${H(0,6,"আউটপুট ফাইল","Output files")}<div class="card scr"><table><tr><th>${T("ফাইল","File")}</th><th>${T("কোথায়","Where")}</th><th>${T("কী","What")}</th></tr>
<tr><td><code>labels/*.txt</code></td><td>Drive: train/, test/</td><td>${T("প্রতি ছবির বক্স লেবেল","Box label per image")}</td></tr>
<tr><td><code>data.yaml</code></td><td>/content/dog_cat/</td><td>${T("ডেটাসেট কনফিগ (পাথ, ক্লাস)","Dataset config (paths, classes)")}</td></tr>
<tr><td><code>best.pt</code>, <code>last.pt</code></td><td>/content/runs/detect/dog_cat_detector*/weights/</td><td>${T("ট্রেন করা মডেল","Trained model")}</td></tr>
<tr><td><code>results.png</code>, confusion matrix</td><td>/content/runs/detect/dog_cat_detector*/</td><td>${T("ট্রেনিং কার্ভ ও ফলাফল","Training curves and results")}</td></tr>
<tr><td><code>best.pt</code> (${T("ব্যাকআপ","backup")})</td><td>/content/drive/MyDrive/</td><td>${T("Colab রিসেট হলেও থাকে","Survives a Colab reset")}</td></tr></table></div></section>`;
h+=`<section id="trouble">${H(0,7,"সমস্যা সমাধান","Troubleshooting")}
<div class="card"><b>No trained weights found</b><p style="margin:6px 0 0">${T("Cell 6 শেষ হয়নি। Cell 4, 5, 6 আবার চালান এবং <code>Results saved to …</code> না আসা পর্যন্ত অপেক্ষা করুন।","Cell 6 did not finish. Re-run Cells 4, 5, 6 and wait for <code>Results saved to …</code>.")}</p></div>
<div class="card"><b>train labels: 0</b><p style="margin:6px 0 0">${T("<code>BASE</code> পাথ, ছবির এক্সটেনশন ও ফাইলের নাম (cat/dog) দেখুন; ছবিতে কুকুর বা বিড়াল শনাক্ত না হলেও লেবেল তৈরি হয় না।","Check the <code>BASE</code> path, image extensions and filenames (cat/dog); images where no dog or cat is detected also get no label.")}</p></div>
<div class="card"><b>CUDA out of memory</b><p style="margin:6px 0 0">${T("Cell 6 এ <code>batch</code> কমিয়ে 4 করুন, অথবা <code>imgsz</code> কমান। রানটাইম GPU (T4) কিনা দেখুন।","Lower <code>batch</code> to 4 in Cell 6, or reduce <code>imgsz</code>. Make sure the runtime is a GPU (T4).")}</p></div>
<div class="card ok"><b>${T("মনে রাখুন","Good to know")}</b><ul><li>${T("লেবেল স্বয়ংক্রিয় তাই ভুল নাম মানে ভুল ক্লাস।","Labels are automatic, so a wrong filename means a wrong class.")}</li><li>${T("Colab রিসেট হলে <code>/content</code> মুছে যায়; Drive এর <code>best.pt</code> ও লেবেল থেকে যায়।","A Colab reset wipes <code>/content</code>; the Drive <code>best.pt</code> and labels stay.")}</li></ul></div></section>`;
document.getElementById("app").innerHTML=h;
document.getElementById("fl").innerHTML=C.map((c,k)=>`<a class="node ${c[2]}" href="#c${k+1}"><b>Cell ${k+1}</b>${T(c[0],c[1])}</a>`).join("");
document.getElementById("nav").innerHTML=S.map((s,k)=>`<a href="#${s[0]}" data-s="${s[0]}"><b>${k+1}</b>${T(s[1],s[2])}</a>`).join("");
const side=document.getElementById("side"),ov=document.getElementById("ov");
function tog(o){side.classList.toggle("open",o);ov.classList.toggle("show",o)}
document.getElementById("bg").onclick=()=>tog(!side.classList.contains("open"));
ov.onclick=()=>tog(false);
side.querySelectorAll("a").forEach(a=>a.onclick=()=>tog(false));
function setLang(l){document.body.className=l;document.documentElement.lang=l;document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));try{localStorage.setItem("lang",l)}catch(e){}}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
try{const v=localStorage.getItem("lang");if(v==="en"||v==="bn")setLang(v)}catch(e){}
function spy(){let cur=S[0][0];S.forEach(s=>{const e=document.getElementById(s[0]);if(e&&e.getBoundingClientRect().top<140)cur=s[0]});document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.s===cur))}
addEventListener("scroll",spy,{passive:true});spy();
</script>
</body>
</html>
